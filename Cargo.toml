[workspace]
resolver = "2"
members = ["crates/connect-core", "crates/connectd"]

# The Tauri shell (app/) is a separate agent's work and is not a member yet.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "process", "sync", "signal", "fs"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
yamux = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
directories = "5"
psl = "2"
# Cookie readers: SQLite + the RustCrypto primitives Chromium uses on macOS/Linux
# (PBKDF2-HMAC-SHA1 -> AES-128-CBC). Windows (AES-256-GCM, app-bound) is out of
# scope in v1, so no aes-gcm.
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
cbc = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha1 = "0.10"
# Token custody in the OS keychain (behind the SecretStore trait; tests never touch it).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# One-shot HTTPS to the hub for claim-pair. rustls, no OpenSSL.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[profile.release]
opt-level = 2
debug = false
strip = true
codegen-units = 16
incremental = false

[profile.dev]
debug = false
incremental = false

[profile.test]
debug = false
incremental = false
