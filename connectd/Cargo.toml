[package]
name = "connectd"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
description = "SNTH Connect core (P0 spike): links a synth to this computer over one outbound WebSocket"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process", "sync", "signal", "fs"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "native-tls"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
yamux = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 2
debug = false
strip = true
codegen-units = 8
incremental = false

[profile.dev]
debug = false
incremental = false
