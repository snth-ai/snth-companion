# Check for SNTH Connect (app/) on every push to a connect/* branch: core
# tests, two self-tests on a real Windows machine (the computer-control
# path, and the owner's apps: toast, clipboard, open), then a Windows
# installer as a workflow artifact. No release, no signing.
# The release pipeline lives in connect-release.yml.

name: connect-build

on:
  push:
    branches:
      - "connect/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Core tests
        run: cargo test -p connect-core

      # The computer-control path as the app runs it, on a real Windows
      # machine: install the pinned driver through our installer, start our
      # private daemon (a named pipe), run one MCP session through our proxy
      # spawn (initialize, tools/list, two read-only tools), check that a
      # child we spawn has no console window, stop the daemon.
      - name: Computer-control self-test
        timeout-minutes: 15
        run: cargo run -p connectd -- selftest cua

      # The owner's apps as Windows has them (notifications, the clipboard,
      # open), through the same gate the synth's calls go through and with
      # the real Windows backend: a toast is shown, a text with non-ASCII
      # letters goes to the clipboard and comes back the same, a text file
      # in a shared folder is opened, the Start menu is listed and an app
      # from it started. It also checks that no Mac app is offered here and
      # that a script, a file outside the shared folder and a file: address
      # are refused.
      - name: Apps self-test
        timeout-minutes: 10
        run: cargo run -p connectd -- selftest apps --touch

      - name: Build the installer
        working-directory: app
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: snth-connect-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
