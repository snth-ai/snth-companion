# Check for SNTH Connect (app/) on every push to a connect/* branch: core
# tests, the island's tests and on-device speech-to-text on real models,
# self-tests on a real Windows machine (the computer-control path,
# the owner's apps: toast, clipboard, open, and the browser link: helper,
# named pipe, registry), then a Windows installer as a workflow artifact. No release, no signing.
# The release pipeline lives in connect-release.yml.

name: connect-build

on:
  push:
    branches:
      - "connect/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Core tests
        run: cargo test -p connect-core

      # The island's on-device speech-to-text on Windows: Parakeet, the
      # Silero ONNX voice detector and the tone's emotion model, all on
      # ONNX Runtime (no whisper.cpp on Windows). First the unit tests of
      # the island (the engine choice, the voice detector's segment logic,
      # the hold flow with a stand-in engine, the microphone's errors).
      - name: Island tests
        run: cargo test -p snth-connect "island::"

      # Then the real thing: the pinned model files downloaded as the app
      # downloads them (resume, sha256, rename; cached between runs), and
      # whole holds through the speech thread on clips the Windows speech
      # synthesizer speaks, plus one of digital silence (dropped).
      - name: Speech clips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stt-e2e | Out-Null
          Add-Type -AssemblyName System.Speech
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo 16000, ([System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen), ([System.Speech.AudioFormat.AudioChannel]::Mono)
          $lines = @(
            "Please open the calendar and find a free afternoon next week.",
            "Send the quarterly report to the design team before Friday.",
            "What is the weather like in London this morning?"
          )
          $refs = @()
          for ($i = 0; $i -lt $lines.Count; $i++) {
            $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
            $s.SetOutputToWaveFile("$PWD\stt-e2e\en$i.wav", $fmt)
            $s.Speak($lines[$i])
            $s.Dispose()
            $refs += "en$i.wav`t$($lines[$i])"
          }
          $n = 16000 * 3
          $w = New-Object System.IO.BinaryWriter([System.IO.File]::Create("$PWD\stt-e2e\zero3.wav"))
          $w.Write([Text.Encoding]::ASCII.GetBytes("RIFF")); $w.Write([int](36 + 2 * $n))
          $w.Write([Text.Encoding]::ASCII.GetBytes("WAVEfmt ")); $w.Write([int]16); $w.Write([int16]1); $w.Write([int16]1)
          $w.Write([int]16000); $w.Write([int]32000); $w.Write([int16]2); $w.Write([int16]16)
          $w.Write([Text.Encoding]::ASCII.GetBytes("data")); $w.Write([int](2 * $n)); $w.Write((New-Object byte[] (2 * $n)))
          $w.Close()
          $refs += "zero3.wav`t"
          $refs | Set-Content -Encoding utf8 stt-e2e\refs.tsv
          Get-ChildItem stt-e2e

      - uses: actions/cache@v4
        with:
          path: stt-models
          key: stt-models-${{ hashFiles('app/src-tauri/src/island/stt/model.rs') }}

      - name: Speech-to-text on real models
        timeout-minutes: 30
        env:
          STT_E2E_CLIPS: ${{ github.workspace }}\stt-e2e
          STT_E2E_MAX: "10"
          STT_E2E_DOWNLOAD_TO: ${{ github.workspace }}\stt-models\parakeet
          STT_E2E_TONE_DOWNLOAD_TO: ${{ github.workspace }}\stt-models\tone
        run: cargo test -p snth-connect -- --ignored stt_e2e_parakeet_onnx --nocapture --test-threads 1

      # The computer-control path as the app runs it, on a real Windows
      # machine: install the pinned driver through our installer, start our
      # private daemon (a named pipe), run one MCP session through our proxy
      # spawn (initialize, tools/list, two read-only tools), check that a
      # child we spawn has no console window, stop the daemon.
      - name: Computer-control self-test
        timeout-minutes: 15
        run: cargo run -p connectd -- selftest cua

      # The owner's apps as Windows has them (notifications, the clipboard,
      # open), through the same gate the synth's calls go through and with
      # the real Windows backend: a toast is shown, a text with non-ASCII
      # letters goes to the clipboard and comes back the same, a text file
      # in a shared folder is opened, the Start menu is listed and an app
      # from it started. It also checks that no Mac app is offered here and
      # that a script, a file outside the shared folder and a file: address
      # are refused.
      - name: Apps self-test
        timeout-minutes: 10
        run: cargo run -p connectd -- selftest apps --touch

      # The browser link (the SNTH Vault extension): the helper a browser
      # starts, as a real process against a real named pipe, and the host
      # manifests with real per-user registry keys (under a host name of
      # the test's own, removed at the end). No browser is involved.
      - name: Browser link tests
        run: cargo test -p connect-host

      - name: Browser link self-test
        timeout-minutes: 10
        run: |
          cargo build -p connect-host
          cargo run -p connectd -- selftest host

      - name: Build the installer
        working-directory: app
        run: npm run tauri build -- --bundles nsis

      # The same self-test with the helper the installer ships (a release
      # build, which connects to the user's real endpoint and nothing else).
      - name: Browser link self-test, the shipped helper
        timeout-minutes: 10
        run: cargo run -p connectd -- selftest host --helper target/release/snth-connect-host.exe --system

      - name: The installer carries the helper
        shell: bash
        run: |
          7z l target/release/bundle/nsis/*.exe > installer-files.txt
          grep -i "snth-connect-host.exe" installer-files.txt

      - uses: actions/upload-artifact@v4
        with:
          name: snth-connect-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
